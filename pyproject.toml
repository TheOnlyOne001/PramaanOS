[project]
name = "saakshi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pynacl>=1.5",
    "cryptography>=42",
    "qrcode>=7.4",
    "httpx>=0.27"
]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, bandit, isort, pyupgrade, simplify, ruff, comprehensions,
# pie, return, perflint and pylint: a strict, security-aware rule set.
select = ["E", "F", "W", "B", "S", "I", "UP", "SIM", "RUF", "C4", "PIE", "RET", "PERF", "PL"]
ignore = [
  "S101",     # assert is fine in tests
  "S311",     # random is used for demo data, never for secrets
  "E731",     # small lambdas in i18n tables read best inline
  "B008",     # FastAPI dependency defaults
  "S608",     # SQL is built from fixed clauses with bound parameters
  "PLR0913", "PLR0917", "PLR0912", "PLR0915", "PLR0911", "PLR2004",  # complexity is reviewed by hand
  "RUF001", "RUF002", "RUF003",  # Tamil, Hindi, Odia and ₹ are intentional
  "PLC0415",  # local imports avoid circular module loading
  "PLW0603",  # one process-wide state object, by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S"]

[tool.coverage.run]
source = ["saakshi"]

[tool.coverage.report]
show_missing = true
